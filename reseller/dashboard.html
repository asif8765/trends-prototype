<!DOCTYPE html>
<html lang="en-PK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{Brand} — Reseller overview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="../brand.config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "var(--color-primary)",
            ink: "var(--color-ink)",
            paper: "var(--color-paper)",
            muted: "var(--color-muted)",
            line: "var(--color-line)",
            surface: "var(--color-surface)",
            accent: "var(--color-accent)",
          },
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"],
            display: ["Fraunces", "Georgia", "serif"],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body data-layout="reseller" data-page="dashboard" class="bg-paper text-ink">
  <div id="app-shell" class="app-shell">
    <div class="flex-1 min-w-0 flex flex-col">
      <main id="app-main" class="flex-1 px-4 sm:px-6 lg:px-8 py-6 max-w-6xl w-full mx-auto">
        
<div class="flex items-start justify-between gap-4 flex-wrap">
  <div>
    <p class="kicker">Reseller · Ayesha Mart</p>
    <h1 class="font-display text-3xl mt-1">Overview</h1>
    <p class="text-sm text-muted mt-1" id="computed"></p>
  </div>
  <div class="flex items-center gap-2">
    <span id="health-badge"></span>
    <a class="btn-ghost btn-sm" href="account-health.html">Account Health</a>
  </div>
</div>
<div id="action-banner" class="card p-4 mt-4 border-l-4" style="border-left-color:var(--color-warning)"></div>
<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-6" id="kpis"></div>
<div class="grid lg:grid-cols-3 gap-4 mt-6">
  <div class="card p-5 lg:col-span-2">
    <div class="flex justify-between items-center"><h2 class="font-semibold">Weekly earnings (delivered only)</h2><span class="text-xs text-muted">Demo</span></div>
    <div id="earn-chart" class="mt-4"></div>
    <div class="flex justify-between text-xs text-muted mt-2"><span>12 weeks ago</span><span>This week</span></div>
  </div>
  <div class="card p-5">
    <h2 class="font-semibold">Wallet</h2>
    <dl class="mt-3 space-y-3 text-sm" id="wallet"></dl>
    <a class="btn-primary btn-sm mt-4 w-full" href="payouts.html">Open payouts</a>
  </div>
</div>
<div class="card p-5 mt-6">
  <div class="flex justify-between items-center"><h2 class="font-semibold">Orders needing confirmation</h2><a class="text-sm text-primary" href="orders.html">All orders</a></div>
  <div class="table-wrap mt-3"><table class="data" id="need-confirm"></table></div>
</div>

      </main>
      <div id="site-footer"></div>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/layout.js"></script>
  
<script>
  document.title = BRAND.name + " — Reseller overview";
  var r = DEMO.reseller, h = DEMO.healthReseller;
  document.getElementById("computed").textContent = DEMO.notice + " · Computed " + DEMO.computedAt;
  document.getElementById("health-badge").innerHTML = '<span class="badge badge-' + r.health + '">' + r.health + "</span>";
  document.getElementById("action-banner").innerHTML = "<strong>Action required.</strong> " + h.actions.map(function(a){return a.title;}).join(" · ") +
    ' <a class="underline" href="account-health.html">Review</a>';
  document.getElementById("kpis").innerHTML = [
    ["Orders today", r.ordersToday, "Booked (demo)"],
    ["Delivery ratio", r.deliveryRatio + "%", "Target ≥ 75%"],
    ["Profit this week", DEMO.pkr(r.profitWeek), "Delivered only"],
    ["Available wallet", DEMO.pkr(r.wallet.available), "Ready to withdraw"],
  ].map(function(k){
    var warn = k[0].indexOf("ratio")>=0 && r.deliveryRatio < 75;
    return '<div class="card p-4"><div class="text-xs text-muted uppercase tracking-wide">'+k[0]+'</div><div class="font-display text-3xl mt-1 '+(warn?"metric-warn":"")+'">'+k[1]+'</div><div class="text-xs text-muted mt-1">'+k[2]+'</div></div>';
  }).join("");
  document.getElementById("wallet").innerHTML =
    "<div class='flex justify-between'><dt>Pending COD</dt><dd class='font-semibold'>"+DEMO.pkr(r.wallet.pending)+"</dd></div>"+
    "<div class='flex justify-between'><dt>Available</dt><dd class='font-semibold'>"+DEMO.pkr(r.wallet.available)+"</dd></div>"+
    "<div class='flex justify-between'><dt>Held / reserve</dt><dd class='font-semibold metric-warn'>"+DEMO.pkr(r.wallet.held)+"</dd></div>"+
    "<p class='text-xs text-muted'><a class=underline href=account-health.html>"+r.wallet.heldReason+"</a></p>";
  renderChart(document.getElementById("earn-chart"), r.earnings);
  var rows = DEMO.ordersReseller.filter(function(o){return /pending|retry|awaiting/i.test(o.confirm+" "+o.status);});
  document.getElementById("need-confirm").innerHTML = "<thead><tr><th>Order</th><th>Product</th><th>City</th><th>Confirm</th><th>SLA</th></tr></thead><tbody>"+
    rows.map(function(o){return "<tr><td>"+o.id+"</td><td>"+o.product+"</td><td>"+o.city+"</td><td>"+statusBadge(o.confirm)+"</td><td>"+o.sla+"</td></tr>";}).join("")+"</tbody>";
</script>

</body></html>
