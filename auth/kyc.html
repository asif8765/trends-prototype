<!DOCTYPE html>
<html lang="en-PK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{Brand} — Supplier KYC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="../brand.config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "var(--color-primary)",
            ink: "var(--color-ink)",
            paper: "var(--color-paper)",
            muted: "var(--color-muted)",
            line: "var(--color-line)",
            surface: "var(--color-surface)",
            accent: "var(--color-accent)",
          },
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"],
            display: ["Fraunces", "Georgia", "serif"],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body data-layout="auth" data-page="kyc" class="bg-paper text-ink">
  <div id="site-nav"></div>
  <main class="max-w-xl mx-auto px-4 py-12">
    <p class="kicker">Supplier onboarding</p>
    <h1 class="font-display text-3xl mt-2">Verify your business</h1>
    <p class="text-muted mt-2">Auto-approval when documents pass OCR and checks. Human review only for flagged exceptions. Do not upload real CNIC images in this demo.</p>
    <form id="kyc-form" class="card p-6 mt-8 space-y-5">
      <div>
        <label class="field" for="cnic">CNIC number</label>
        <input id="cnic" required placeholder="XXXXX-XXXXXXX-X" />
      </div>
      <div>
        <label class="field" for="ntn">NTN (if registered)</label>
        <input id="ntn" placeholder="XXXXXXX-X" />
      </div>
      <div>
        <label class="field" for="bank">Bank / Raast IBAN</label>
        <input id="bank" required placeholder="PK00 XXXX 0000 0000 0000" />
      </div>
      <div>
        <span class="field">Document uploads (demo UI)</span>
        <div class="grid sm:grid-cols-2 gap-3 mt-2">
          <label class="upload-tile">CNIC front photo<br/><span class="text-xs text-muted">PNG or JPG</span>
            <input type="file" accept="image/*" class="hidden" onchange="this.parentElement.querySelector('span').textContent='Selected (not uploaded)'" />
          </label>
          <label class="upload-tile">CNIC back photo<br/><span class="text-xs text-muted">PNG or JPG</span>
            <input type="file" accept="image/*" class="hidden" onchange="this.parentElement.querySelector('span').textContent='Selected (not uploaded)'" />
          </label>
          <label class="upload-tile">Warehouse exterior<br/><span class="text-xs text-muted">Must be an original photo</span>
            <input type="file" accept="image/*" class="hidden" onchange="this.parentElement.querySelector('span').textContent='Selected (not uploaded)'" />
          </label>
          <label class="upload-tile">Warehouse interior / stock<br/><span class="text-xs text-muted">Must be an original photo</span>
            <input type="file" accept="image/*" class="hidden" onchange="this.parentElement.querySelector('span').textContent='Selected (not uploaded)'" />
          </label>
        </div>
      </div>
      <button class="btn-primary w-full" type="submit">Submit for auto-review</button>
    </form>
  </main>
  <div id="site-footer"></div>

  <script src="../js/data.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/layout.js"></script>
  

<script>document.title = BRAND.name + " — Supplier KYC";</script>
</body></html>
