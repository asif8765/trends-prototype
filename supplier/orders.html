<!DOCTYPE html>
<html lang="en-PK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{Brand} — Orders to dispatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="../brand.config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "var(--color-primary)",
            ink: "var(--color-ink)",
            paper: "var(--color-paper)",
            muted: "var(--color-muted)",
            line: "var(--color-line)",
            surface: "var(--color-surface)",
            accent: "var(--color-accent)",
          },
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"],
            display: ["Fraunces", "Georgia", "serif"],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body data-layout="supplier" data-page="orders" class="bg-paper text-ink">
  <div id="app-shell" class="app-shell">
    <div class="flex-1 min-w-0 flex flex-col">
      <main id="app-main" class="flex-1 px-4 sm:px-6 lg:px-8 py-6 max-w-6xl w-full mx-auto">
        
<p class="kicker">Supplier dispatch</p>
<h1 class="font-display text-3xl mt-1">Orders to dispatch</h1>
<p class="text-sm text-muted mt-1">SLA timers count down to the 24h / 48h handover. Overdue rows are highlighted.</p>
<div class="card mt-5"><div class="table-wrap"><table class="data" id="tbl"></table></div></div>

      </main>
      <div id="site-footer"></div>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/layout.js"></script>
  
<script>
  document.title = BRAND.name + " — Orders to dispatch";
  document.getElementById("tbl").innerHTML = "<thead><tr><th>Order</th><th>SKU</th><th>Product</th><th>City</th><th>Reseller</th><th>Courier</th><th>Status</th><th>SLA</th><th></th></tr></thead><tbody>"+
    DEMO.ordersSupplier.map(function(o){
      var row = o.slaHours<0 ? " style='background:var(--color-danger-soft)'" : "";
      return "<tr"+row+"><td class='font-semibold'>"+o.id+"</td><td>"+o.sku+"</td><td>"+o.product+"</td><td>"+o.city+"</td><td>"+o.reseller+"</td><td>"+o.courier+"</td><td>"+statusBadge(o.status)+"</td><td class='"+slaClass(o.slaHours)+"'>"+slaLabel(o.slaHours)+"</td><td><button class='btn-primary btn-sm' data-action='print-label'>Print label</button></td></tr>";
    }).join("")+"</tbody>";
</script>

</body></html>
